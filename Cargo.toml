[workspace]
resolver = "2"
members = [
  "compat/jupiter-amm-interface",
  "compat/solana-program",
  "lib",
  "client/rust/jup",
  "client/rust/slim",
  "client/okx",
  "programs/manifest",
  "programs/wrapper",
  "programs/ui-wrapper",
  "scripts/manifest-replay",
]

# Keep every SBF entry point on the compiler used for CU measurements,
# including local builds, the private benchmark harness, and verifiable builds.
# cargo-build-sbf and cargo-test-sbf read this workspace setting automatically.
[workspace.metadata.solana]
tools-version = "v1.57"

# Keep solana-verify's container toolchain aligned with CI. The image itself is
# pinned by digest in ci-verifiable-build.yml.
[workspace.metadata.cli]
solana = "4.2.2"

[patch.crates-io]
# Jupiter 0.5.1 is the last interface that exposes the legacy Openbook route
# used by Manifest. Its unbounded Solana dependencies otherwise resolve to an
# incompatible mix of 2.x and 3.x crates, so keep the API and pin its internals
# to the runtime generation used by this workspace.
jupiter-amm-interface = { path = "compat/jupiter-amm-interface" }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(colored)',
  'cfg(target_os, values("solana"))',
  'cfg(feature, values("certora-test", "custom-panic", "custom-heap", "fuzz"))',
] }

[workspace.dependencies]
shank = "0.4.2"
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "11.0.0", features = [ "no-entrypoint" ] }
spl-token-2022-interface = "3.1.1"
solana-program = { version = "=4.0.0", path = "compat/solana-program" }
solana-pubkey = "=4.2.0"
solana-instruction = "=3.4.0"
solana-account = "=4.3.1"
solana-keypair = "=3.1.2"
solana-signer = "=3.0.1"
solana-transaction = "=4.1.4"
solana-clock = "=3.1.1"
solana-compute-budget-interface = "=3.0.0"
solana-sdk-ids = "=3.1.0"
solana-system-interface = { version = "=3.2.0", features = ["bincode"] }
pinocchio = { version = "0.10.2", features = ["cpi"] }
pinocchio-system = "0.5"
pinocchio-token = "0.5"
borsh = "=0.10"
bytemuck = "1.7.2"
num_enum = "=0.5.11"
thiserror = "1.0.66"
solana-security-txt = "=1.1.2"
static_assertions = "=1.1.0"
solana-invoke = "=0.5.0"
solana-curve25519 = "=3.1.12"

anyhow = "1.0.66"
solana-program-test = { version = "=4.2.2", features = ["agave-unstable-api"] }
solana-logger = "=3.0.0"
solana-sdk = "=4.0.1"
solana-hash = "=4.5.0"
solana-address-lookup-table-interface = "=4.0.0"
tokio = "1.28.0"

nondet = { path = "certora/solana-cvt/nondet" }
cvt = { path = "certora/solana-cvt/cvt" }
early-panic = { path = "certora/solana-cvt/early-panic" }
cvt-macros = { path = "certora/solana-cvt/cvt-macros" }
calltrace = { path = "certora/solana-cvt/calltrace" }
solana_cvt = { path = "certora/solana-cvt/solana_cvt" }
hook_macro = { path = "certora/solana-cvt/hook_macro" }
vectors = { path = "certora/solana-cvt/vectors" }
arrayref = "0.3.7"
five8_core = { version = "=0.1.2", features = ["std"] }

# https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.release]
codegen-units = 1
lto = "fat"
# Kept on deliberately. Measured 2026-08 on SBPF v2: turning this off saves
# 0-2.4% CU (about 118 CU on a single-order batch update, 400 on five orders,
# nothing on deposit/withdraw/swap). In exchange every plain +, - and * that is
# not explicitly checked (lamport fees, byte offsets, indices) would wrap
# silently instead of failing the transaction, and the audits and formal
# verification were done with it on. Prefer targeted wrapping ops with a
# proof, like the entrypoint does, over flipping this.
overflow-checks = true
strip = "debuginfo"

[profile.release.build-override]
codegen-units = 1
incremental = false
opt-level = 3
strip = "debuginfo"

# Test with release settings so CU usage is accurately measured.
[profile.test]
lto = "fat"
opt-level = 3
debug = false
codegen-units = 1
overflow-checks = true
strip = "debuginfo"
