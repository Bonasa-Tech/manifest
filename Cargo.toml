[workspace]
resolver = "2"
members = [
  "lib",
  "client/rust/jup",
  "client/rust/slim",
  "client/okx",
  "programs/manifest",
  "programs/wrapper",
  "programs/ui-wrapper",
]

# Keep every SBF entry point on the compiler used for CU measurements,
# including local builds, the private benchmark harness, and verifiable builds.
# cargo-build-sbf and cargo-test-sbf read this workspace setting automatically.
[workspace.metadata.solana]
tools-version = "v1.57"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(colored)',
  'cfg(target_os, values("solana"))',
  'cfg(feature, values("certora-test", "custom-panic", "custom-heap", "fuzz"))',
] }

[workspace.dependencies]
shank = "0.4.2"
spl-token = { version = "8.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "9.0.0", features = [ "no-entrypoint" ] }
solana-program = "=2.2.1"
solana-pubkey = "=2.2.1"
solana-instruction = "=2.2.1"
solana-account = "=2.2.1"
solana-keypair = "=2.2.1"
solana-signer = "=2.2.1"
solana-transaction = "=2.2.1"
solana-clock = "=2.2.1"
solana-compute-budget-interface = "=2.2.1"
pinocchio = { version = "0.10.2", features = ["cpi"] }
pinocchio-system = "0.5"
pinocchio-token = "0.5"
borsh = "=0.10"
bytemuck = "1.7.2"
num_enum = "=0.5.11"
thiserror = "1.0.66"
solana-security-txt = "=1.1.2"
static_assertions = "=1.1.0"
solana-invoke = "=0.4.0"
solana-curve25519 = "=2.2.4"

anyhow = "1.0.66"
solana-program-test = "=2.2.4"
solana-logger = "=2.2.1"
solana-sdk = "=2.2.4"
solana-hash = "=2.2.1"
solana-address-lookup-table-interface = "=2.2.2"
tokio = "1.28.0"

nondet = { path = "certora/solana-cvt/nondet" }
cvt = { path = "certora/solana-cvt/cvt" }
early-panic = { path = "certora/solana-cvt/early-panic" }
cvt-macros = { path = "certora/solana-cvt/cvt-macros" }
calltrace = { path = "certora/solana-cvt/calltrace" }
solana_cvt = { path = "certora/solana-cvt/solana_cvt" }
hook_macro = { path = "certora/solana-cvt/hook_macro" }
vectors = { path = "certora/solana-cvt/vectors" }
arrayref = "0.3.7"

# https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.release]
codegen-units = 1
lto = "fat"
# Turned off. Measured 2026-08 on SBPF v2 it saves 0-2.4% CU (about 118 CU on
# a single-order batch update, 400 on five orders, nothing on
# deposit/withdraw/swap), and 1,366 -> 1,312 CU at the median of the replayed
# mainnet transactions. With it off, every plain +, - and * that is not
# explicitly checked wraps silently instead of trapping, so the arithmetic
# that carries trader value does not rely on this flag: the quantity operators
# and the gas-refund lamport settlement check themselves (see quantities.rs and
# state/utils.rs), and value-bearing multiplies use the checked_* forms. What
# is left unchecked is offsets, sizes and counters, each bounded well below
# u32/usize by the 10 MB account-size limit, plus the reciprocal-multiply
# division whose ranges are proven in quantities.rs. Externally supplied index
# hints, which the account size does not bound, are range-checked before use
# (require_index_hint_in_bounds); see also the get_helper note in
# lib/src/utils.rs. The audits and the formal verification were done with this
# flag on, so re-run them against this build.
overflow-checks = false
strip = "debuginfo"

[profile.release.build-override]
codegen-units = 1
incremental = false
opt-level = 3
strip = "debuginfo"

# Test with release settings so CU usage is accurately measured.
[profile.test]
lto = "fat"
opt-level = 3
debug = false
codegen-units = 1
overflow-checks = true
strip = "debuginfo"
