[workspace]
resolver = "2"
members = [
  "lib",
  "client/rust/jup",
  "client/rust/slim",
  "client/okx",
  "programs/manifest",
  "programs/wrapper",
  "programs/ui-wrapper",
]

# Keep every SBF entry point on the compiler used for CU measurements,
# including local builds, the private benchmark harness, and verifiable builds.
# cargo-build-sbf and cargo-test-sbf read this workspace setting automatically.
[workspace.metadata.solana]
tools-version = "v1.57"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(colored)',
  'cfg(target_os, values("solana"))',
  'cfg(feature, values("certora-test", "custom-panic", "custom-heap", "fuzz"))',
] }

[workspace.dependencies]
shank = "0.4.2"
spl-token = { version = "8.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "9.0.0", features = [ "no-entrypoint" ] }
solana-program = "=2.2.1"
solana-pubkey = "=2.2.1"
solana-instruction = "=2.2.1"
solana-account = "=2.2.1"
solana-keypair = "=2.2.1"
solana-signer = "=2.2.1"
solana-transaction = "=2.2.1"
solana-clock = "=2.2.1"
solana-compute-budget-interface = "=2.2.1"
pinocchio = { version = "0.10.2", features = ["cpi"] }
pinocchio-system = "0.5"
pinocchio-token = "0.5"
borsh = "=0.10"
bytemuck = "1.7.2"
num_enum = "=0.5.11"
thiserror = "1.0.66"
solana-security-txt = "=1.1.2"
static_assertions = "=1.1.0"
solana-invoke = "=0.4.0"
solana-curve25519 = "=2.2.4"

anyhow = "1.0.66"
solana-program-test = "=2.2.4"
solana-logger = "=2.2.1"
solana-sdk = "=2.2.4"
solana-hash = "=2.2.1"
solana-address-lookup-table-interface = "=2.2.2"
tokio = "1.28.0"

nondet = { path = "certora/solana-cvt/nondet" }
cvt = { path = "certora/solana-cvt/cvt" }
early-panic = { path = "certora/solana-cvt/early-panic" }
cvt-macros = { path = "certora/solana-cvt/cvt-macros" }
calltrace = { path = "certora/solana-cvt/calltrace" }
solana_cvt = { path = "certora/solana-cvt/solana_cvt" }
hook_macro = { path = "certora/solana-cvt/hook_macro" }
vectors = { path = "certora/solana-cvt/vectors" }
arrayref = "0.3.7"

# https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.release]
codegen-units = 1
lto = "fat"
# Kept on deliberately. Measured 2026-08 on SBPF v2: turning this off saves
# 0-2.4% CU (about 118 CU on a single-order batch update, 400 on five orders,
# nothing on deposit/withdraw/swap). In exchange every plain +, - and * that is
# not explicitly checked (lamport fees, byte offsets, indices) would wrap
# silently instead of failing the transaction, and the audits and formal
# verification were done with it on. Prefer targeted wrapping ops with a
# proof, like the entrypoint does, over flipping this.
overflow-checks = false
strip = "debuginfo"

[profile.release.build-override]
codegen-units = 1
incremental = false
opt-level = 3
strip = "debuginfo"

# Test with release settings so CU usage is accurately measured.
[profile.test]
lto = "fat"
opt-level = 3
debug = false
codegen-units = 1
overflow-checks = true
strip = "debuginfo"
