# Compute unit benchmark.
#
# Replays real mainnet order flow (recorded from another Solana CLOB) through
# the manifest and wrapper programs with the benchmarking harness that lives
# in the private Bonasa-Tech/manifest-private repository, then records the CU
# per order percentiles with github-action-benchmark. Results for `main` are
# published to the `gh-pages` branch; pull requests get a comparison against
# `main` in the job summary (and a comment if a regression trips the alert
# threshold) without publishing anything.
#
# Requirements:
#   * secret  MANIFEST_PAT: token that can read manifest-private.
#   * variable MANIFEST_PRIVATE_BENCHMARK_V3_SHA: full SHA of the published,
#     reviewed v3 harness (including the cancel-all adapter and order accounting).
#
# The harness expects this repository at manifest-private/deps/manifest; that
# directory is populated from the commit being benchmarked, so the private
# repository's own submodule pointer is never used.
name: Benchmark
on:
  push:
    branches: ['main']
    paths:
      [
        'lib/**',
        'programs/**',
        'Cargo.toml',
        'Cargo.lock',
        'scripts/assert-sbpf-v3.sh',
        '.github/workflows/ci-benchmark.yml',
      ]
  pull_request:
    paths:
      [
        'lib/**',
        'programs/**',
        'Cargo.toml',
        'Cargo.lock',
        'scripts/assert-sbpf-v3.sh',
        '.github/workflows/ci-benchmark.yml',
      ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SOLANA_VERSION: '4.2.2'
  SVM_ARCH: 'v3'
  # The Agave 4.2 ProgramTest replay harness requires Rust 1.93.
  RUST_TOOLCHAIN: '1.93.0'
  # Must match workspace.metadata.solana.tools-version. The benchmark harness
  # builds this checkout from its workspace, so the workspace pin is what
  # selects this SBF compiler for the measured programs.
  PLATFORM_TOOLS: 'v1.57'
  # Keep the v3 build driver and Agave 4.2.2 harness on a separate reviewed pin
  # so preparing this migration does not change main's existing v2 harness.
  BENCHMARK_REPOSITORY_SHA: ${{ vars.MANIFEST_PRIVATE_BENCHMARK_V3_SHA }}

jobs:
  benchmark:
    name: Benchmark CU
    # The private harness needs MANIFEST_PAT, which pull requests from forks
    # cannot access.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The benchmark's copy of this repository is fetched out of this
          # checkout below, and git refuses to serve a fetch from a shallow
          # repository, so take the full history here.
          fetch-depth: 0

      - name: Validate pinned benchmark revision
        shell: bash
        run: |
          if [[ ! "$BENCHMARK_REPOSITORY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Set repository variable MANIFEST_PRIVATE_BENCHMARK_V3_SHA to the full SHA of the published, reviewed v3 harness' >&2
            exit 1
          fi

      - name: Checkout benchmarking repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Bonasa-Tech/manifest-private
          token: ${{ secrets.MANIFEST_PAT }}
          path: manifest-private
          ref: ${{ env.BENCHMARK_REPOSITORY_SHA }}
          submodules: false
          persist-credentials: false

      - name: Use this commit as the benchmark's manifest dependency
        # Initialize only the reviewed public dependency, from the commit that
        # was just checked out (no network, and independent of the private
        # repository's submodule URL). Other private-repo submodules remain
        # disabled.
        shell: bash
        run: |
          set -euo pipefail
          DEP="$GITHUB_WORKSPACE/manifest-private/deps/manifest"
          mkdir -p "$DEP"
          git -C "$DEP" init --quiet
          git -C "$DEP" fetch --quiet --depth 1 "file://$GITHUB_WORKSPACE" HEAD
          git -C "$DEP" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$DEP" rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Benchmarking manifest commit $(git -C "$DEP" rev-parse HEAD)"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'

      - name: Cache dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: 'solana-${{ env.SOLANA_VERSION }}-platform-tools-${{ env.PLATFORM_TOOLS }}-arch-${{ env.SVM_ARCH }}-${{ github.job }}'
          workspaces: |
            . -> target
            manifest-private/deps/manifest -> target
            manifest-private/benchmarking -> target

      - name: Set Rust version
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }}

      - name: Install Solana
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output solana-install.sh https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install
          echo 'e16c8a1f07996b6255a67a53c651f2e859c7d5217b360fd6613cc3c3cae46bd4  solana-install.sh' | sha256sum --check --strict
          sh solana-install.sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
          solana --version
          echo "Generating keypair..."
          solana-keygen new -o "$HOME/.config/solana/id.json" --no-passphrase --silent

      - name: Preinstall platform-tools ${{ env.PLATFORM_TOOLS }}
        # cargo-build-sbf validates --tools-version against the redirect target
        # of platform-tools/releases/latest and refuses anything newer, falling
        # back to its built-in version with only a warn!. GitHub's "latest" is
        # the most recently published release, not the highest version, so the
        # v1.51.1 upstream published on 2026-09-15 silently downgraded every
        # build from the version we ask for down to the built-in v1.48
        # (rustc 1.84.1) - which is why a TypeScript-only commit went red.
        #
        # Resolution checks ~/.cache/solana for an installed toolchain before it
        # consults that pointer, so extracting it here means the version we ask
        # for is the version we get, whatever upstream publishes next.
        run: |
          set -euo pipefail
          DEST="$HOME/.cache/solana/${{ env.PLATFORM_TOOLS }}/platform-tools"
          if [ -d "$DEST" ]; then
            echo "already present: $DEST"
            exit 0
          fi
          TARBALL=platform-tools-linux-x86_64.tar.bz2
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$TARBALL" \
            "https://github.com/anza-xyz/platform-tools/releases/download/${{ env.PLATFORM_TOOLS }}/$TARBALL"
          echo 'b0f7af104adf726fff2a6a09ea2eb2f2d2965c92295f4d7388c08d140e0c2b00  '"$TARBALL" \
            | sha256sum --check --strict
          mkdir -p "$DEST"
          tar -xjf "$TARBALL" -C "$DEST"
          rm -f "$TARBALL"
          # Confirm the extract is what we think it is. An empty or wrong
          # directory would still satisfy the cache lookup and send the build
          # back to the fallback without saying so.
          "$DEST/rust/bin/rustc" --version
          echo "installed ${{ env.PLATFORM_TOOLS }} to $DEST"

      - name: Report SBF toolchain
        # Every config here asks for one platform-tools version, but the builds
        # were running rustc 1.84.1-dev, the built-in v1.48. The
        # fallback is silent, so print what is actually resolved. This matters
        # for CU: the programs measured below are only comparable across runs
        # if they were built by the same compiler.
        run: |
          echo "requested PLATFORM_TOOLS: ${{ env.PLATFORM_TOOLS }}"
          cargo build-sbf --version
          echo "--- with explicit --tools-version ---"
          cargo build-sbf --tools-version ${{ env.PLATFORM_TOOLS }} --version

      - name: Run benchmark
        run: cd $GITHUB_WORKSPACE/manifest-private; RUSTUP_TOOLCHAIN=${{ env.RUST_TOOLCHAIN }} SVM_ARCH=${{ env.SVM_ARCH }} SBF_ARCH=${{ env.SVM_ARCH }} ./benchmarking/benchmark.sh

      - name: Verify replay accounting
        # These describe the pinned input corpus, not a Manifest CU baseline.
        # Missing cancel-all adaptation or old normalization must fail loudly.
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          with open('manifest-private/benchmarking/benchmark_results.csv', newline='') as file:
              rows = list(csv.DictReader(file))
          counts = [int(row['num_orders']) for row in rows]
          if (len(rows), len({row['signature'] for row in rows}), counts.count(0), sum(counts)) != (4158, 4158, 1, 101618):
              raise SystemExit('Replay corpus/accounting mismatch: check the cancel-all adapter and private harness pin')
          PY

      - name: Verify benchmark program architecture
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifest_artifacts < <(find "$GITHUB_WORKSPACE/manifest-private" -type f -path '*/target/deploy/manifest.so' -print)
          mapfile -t wrapper_artifacts < <(find "$GITHUB_WORKSPACE/manifest-private" -type f -path '*/target/deploy/wrapper.so' -print)
          if (( ${#manifest_artifacts[@]} == 0 || ${#wrapper_artifacts[@]} == 0 )); then
            echo 'benchmark did not leave manifest.so and wrapper.so artifacts to validate' >&2
            exit 1
          fi
          ./scripts/assert-sbpf-v3.sh "${manifest_artifacts[@]}" "${wrapper_artifacts[@]}"

      - name: Move benchmark results
        run: |
          mv $GITHUB_WORKSPACE/manifest-private/output.txt $GITHUB_WORKSPACE/output.txt

      - name: Validate benchmark output
        shell: bash
        run: |
          test -s output.txt
          test "$(wc -c < output.txt)" -le 1048576
          if LC_ALL=C grep -q '[^[:print:][:space:]]' output.txt; then
            echo 'benchmark output contains non-text bytes' >&2
            exit 1
          fi

      - name: Summarize benchmark output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          print('## CU per order')
          print()
          print('| Benchmark | CU |')
          print('| --- | ---: |')
          for result in json.load(open('output.txt')):
              print(f"| {result['name']} | {result['value']} |")
          PY

      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: benchmark-output
          path: output.txt
          if-no-files-found: error

  publish-benchmark:
    name: Publish benchmark
    needs: benchmark
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: benchmark-output
          path: .

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: CU Benchmark
          tool: 'customSmallerIsBetter'
          output-file-path: output.txt
          fail-on-alert: true
          summary-always: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true

          # Push and deploy GitHub pages branch automatically
          auto-push: true

  compare-benchmark:
    name: Compare benchmark with main
    needs: benchmark
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: benchmark-output
          path: .

      - name: Compare benchmark result
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: CU Benchmark
          tool: 'customSmallerIsBetter'
          output-file-path: output.txt
          fail-on-alert: true
          summary-always: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true

          # Only compare against the published `main` data, never store.
          auto-push: false
          save-data-file: false
