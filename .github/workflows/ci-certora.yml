name: Certora Formal Verification
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'programs/manifest/**'
      - 'lib/**'
      - 'certora/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci-certora.yml'
  workflow_dispatch:
jobs:
 build_verification_program:
    name: Build and validate Certora v3 ELF
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned verification tools
        run: |
          rustup toolchain install 1.93.0
          cargo +1.93.0 install cargo-certora-sbf --version 0.3.5 --locked
          python3 -m pip install certora-cli==8.13.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: 'certora-v1.53-v3-${{ github.job }}'
      - name: Compile the actual prover configurations without submitting jobs
        # This uses Certora platform-tools v1.53's Rust 1.89, enforcing the
        # verification compiler ceiling on PRs (including forks) without keys.
        working-directory: programs/manifest/src/certora/confs
        run: |
          for conf in rules.conf rules-global.conf rules-reverse.conf rules-seat-integrity.conf hypertree.conf; do
            certoraSolanaProver "$conf" --compilation_steps_only
            ../../../../../scripts/assert-sbpf-v3.sh ../../../../../target/sbpfv3-solana-solana/release/manifest.so
          done
 submit_verification_jobs:
    if: github.event_name != 'pull_request'
    needs: build_verification_program
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      statuses: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Submit verification jobs to Certora Prover
        uses: Certora/certora-run-action@5a48bad92e08e69dcff67fecbea42086bb9fe83d # v1.4.1
        with:
          configurations: |-
            rules.conf
            rules-global.conf
            rules-reverse.conf
            rules-seat-integrity.conf
            hypertree.conf
          job-name:  "manifest rules"
          ecosystem: solana
          working-directory: programs/manifest/src/certora/confs
          certora-key: ${{ secrets.CERTORAKEY }}
          cli-version: "8.13.0"
          rust-version: "1.93.0"
          certora-sbf-version: "0.3.5"
          # cargo-certora-sbf currently supports platform-tools through v1.53.
          # base.conf pins the actual proof build to v3. These options only
          # preinstall its toolchain; build_verification_program checks the ELF.
          certora-sbf-options: "-vvv --tools-version=v1.53 --arch=v3"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
