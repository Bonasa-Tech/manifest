name: Code Review - Rust
on:
  push:
    branches: ['main']
  pull_request:
    paths:
      [
        'programs/**',
        'client/rust/**',
        'lib/**',
        'Cargo.toml',
        'Cargo.lock',
      ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SOLANA_VERSION: '2.2.20'
  SVM_ARCH: 'v2'
  # pinocchio's account view crates need rustc 1.89 to build, so the host
  # toolchain moves up with them.
  RUST_TOOLCHAIN: '1.89.0'
  # Must match workspace.metadata.solana.tools-version. The SBF programs are
  # built with platform tools v1.57, which ships a newer
  # rustc (1.95) than the default. Same source, better codegen: measured on
  # the replay benchmark it is worth about 4% of MFX compute per order. The
  # host toolchain above is unchanged; this only selects the SBF compiler.
  PLATFORM_TOOLS: 'v1.57'

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set Rust version
        run: |
          rustup toolchain install nightly
          rustup component add rustfmt --toolchain nightly

      - name: Run fmt
        run: cargo +nightly fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "solana-${{ env.SOLANA_VERSION }}-platform-tools-${{ env.PLATFORM_TOOLS }}"

      - name: Set Rust version
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }}
          rustup component add clippy

      - name: Run clippy
        # The certora/solana-cvt crates are vendored from Certora and are
        # path dependencies, which makes them implicit workspace members.
        # They are excluded rather than held to this repository's lint
        # policy, so the fork stays diffable against upstream.
        run: cargo clippy --workspace --exclude fixed --exclude checked_math --exclude calltrace --exclude cvt --exclude cvt-macros --exclude derive_nondet --exclude early-panic --exclude hook_macro --exclude nondet --exclude solana_cvt --exclude stubs --exclude vectors -- --no-deps --deny=warnings --allow=clippy::style --allow=clippy::complexity --allow=clippy::manual-retain --allow=clippy::crate-in-macro-def --allow=clippy::result-large-err --allow=clippy::derive_partial_eq_without_eq --allow=clippy::multiple-bound-locations --allow=unexpected-cfgs

      # The prover itself only runs on main (ci-certora.yml), so nothing else
      # on a pull request compiles the code behind the certora feature, which
      # swaps in its own quantities and specs. Cheap to keep it building here
      # rather than finding out after a merge.
      - name: Build with the certora feature
        run: cargo check -p manifest-dex --features certora --lib

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "solana-${{ env.SOLANA_VERSION }}-platform-tools-${{ env.PLATFORM_TOOLS }}"

      - name: Set Rust version
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }}

      - name: Install Solana
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output solana-install.sh https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install
          echo '4caed81545b20ddcbc06d65ca8ef8dc69fc9e68fe93a868f5b508309021b49af  solana-install.sh' | sha256sum --check --strict
          sh solana-install.sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
          solana --version
          echo "Generating keypair..."
          solana-keygen new -o "$HOME/.config/solana/id.json" --no-passphrase --silent

      - name: Build all deps
        run: |
          cargo build-sbf --arch=${{ env.SVM_ARCH }} --tools-version ${{ env.PLATFORM_TOOLS }} -- -p manifest-dex -p wrapper -p ui-wrapper

      - name: Run sbf tests
        run: cargo test-sbf --arch=${{ env.SVM_ARCH }} --tools-version ${{ env.PLATFORM_TOOLS }} --features "test,test-sbf" -- --test-threads 1

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "solana-${{ env.SOLANA_VERSION }}"

      - name: Set Rust version
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }}

      - name: Install Solana
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output solana-install.sh https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install
          echo '4caed81545b20ddcbc06d65ca8ef8dc69fc9e68fe93a868f5b508309021b49af  solana-install.sh' | sha256sum --check --strict
          sh solana-install.sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
          solana --version
          echo "Generating keypair..."
          solana-keygen new -o "$HOME/.config/solana/id.json" --no-passphrase --silent

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@faf6515f98a6da02430741fd0af1094fde82286d # cargo-llvm-cov

      # The tests below drive the on-chain programs through BanksClient.
      # pinocchio compiles its syscalls to nothing off chain, so they load the
      # compiled programs instead of running the entrypoint natively, and need
      # them built first.
      #
      # `--features test` because the host tests are run with it, and it
      # selects a different fee collector; a program built without it rejects
      # the collector the tests use. One program per invocation because
      # building them together unifies features, and the wrapper's
      # `manifest-dex/no-entrypoint` would then strip manifest's entrypoint
      # and leave every instruction failing as UnsupportedProgramId.
      # One program per invocation, from its own directory. Selecting a
      # package with `-p` from the workspace root makes cargo-build-sbf look
      # for the artifact under the wrong name and fail with "Unable to get
      # file metadata"; building them together instead unifies features, and
      # the wrapper's `manifest-dex/no-entrypoint` would strip manifest's
      # entrypoint and leave every instruction failing as UnsupportedProgramId.
      - name: Build the programs for the integration tests
        run: |
          (cd programs/manifest && cargo build-sbf --arch=${{ env.SVM_ARCH }} --tools-version ${{ env.PLATFORM_TOOLS }} --features test)
          (cd programs/wrapper && cargo build-sbf --arch=${{ env.SVM_ARCH }} --tools-version ${{ env.PLATFORM_TOOLS }} --features test)
          (cd programs/ui-wrapper && cargo build-sbf --arch=${{ env.SVM_ARCH }} --tools-version ${{ env.PLATFORM_TOOLS }} --features test)

      # split coverage test runs to avoid enabling no-clock feature during unit tests
      # and to handle packages with/without test features separately.
      # The certora/solana-cvt crates are vendored from Certora and are path
      # dependencies, which makes them implicit workspace members; their tests
      # need tooling this job does not have, so they are excluded here as they
      # are for clippy.
      - name: Generate code coverage
        env:
          SBF_OUT_DIR: ${{ github.workspace }}/target/deploy
        run: |
          cargo llvm-cov --no-report --workspace --exclude manifest-jupiter --exclude manifest-client --exclude calltrace --exclude cvt --exclude cvt-macros --exclude derive_nondet --exclude early-panic --exclude hook_macro --exclude nondet --exclude solana_cvt --exclude stubs --exclude vectors --features test  -- --nocapture --test-threads 1
          cargo llvm-cov --no-report --package manifest-jupiter --features test  -- --nocapture --test-threads 1
          cargo llvm-cov --no-report --package manifest-client -- --nocapture --test-threads 1
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          verbose: true
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
