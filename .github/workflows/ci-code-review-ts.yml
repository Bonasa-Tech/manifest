name: Code Review - TypeScript

on:
  pull_request:
    branches: ['main']
    paths: [
      'client/ts/**',
      'client/idl/*.json',
      'programs/**/instruction.rs',
      'yarn.lock'
    ]
  push:
    branches: ['main']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SOLANA_VERSION: '2.2.12'
  # pinocchio's account view crates need rustc 1.89 to build, so the host
  # toolchain moves up with them.
  RUST_TOOLCHAIN: '1.89.0'
  # Must match workspace.metadata.solana.tools-version.
  PLATFORM_TOOLS: 'v1.57'

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Format
        run: yarn format

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

  depcheck:
    name: Dependency check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Duplicates check
        run: npx yarn-deduplicate --list --fail

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Cache dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "solana-${{ env.SOLANA_VERSION }}-platform-tools-${{ env.PLATFORM_TOOLS }}"

      - name: Set Rust version
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }}

      - name: Install Solana
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output solana-install.sh https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install
          echo '1430da752981d0b3b09cb35d73adede97ec82f04a8e2d2fb0780d547b01c555a  solana-install.sh' | sha256sum --check --strict
          sh solana-install.sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
          solana --version
          echo "Generating keypair..."
          solana-keygen new -o "$HOME/.config/solana/id.json" --no-passphrase --silent

      - name: Preinstall platform-tools ${{ env.PLATFORM_TOOLS }}
        # cargo-build-sbf validates --tools-version against the redirect target
        # of platform-tools/releases/latest and refuses anything newer, falling
        # back to its built-in version with only a warn!. GitHub's "latest" is
        # the most recently published release, not the highest version, so the
        # v1.51.1 upstream published on 2026-09-15 silently downgraded every
        # build from the v1.57 we ask for (rustc 1.95) to the built-in v1.48
        # (rustc 1.84.1) - which is why a TypeScript-only commit went red.
        #
        # Resolution checks ~/.cache/solana for an installed toolchain before it
        # consults that pointer, so extracting it here means the version we ask
        # for is the version we get, whatever upstream publishes next.
        run: |
          set -euo pipefail
          DEST="$HOME/.cache/solana/${{ env.PLATFORM_TOOLS }}/platform-tools"
          if [ -d "$DEST" ]; then
            echo "already present: $DEST"
            exit 0
          fi
          TARBALL=platform-tools-linux-x86_64.tar.bz2
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$TARBALL" \
            "https://github.com/anza-xyz/platform-tools/releases/download/${{ env.PLATFORM_TOOLS }}/$TARBALL"
          echo 'b0f7af104adf726fff2a6a09ea2eb2f2d2965c92295f4d7388c08d140e0c2b00  '"$TARBALL" \
            | sha256sum --check --strict
          mkdir -p "$DEST"
          tar -xjf "$TARBALL" -C "$DEST"
          rm -f "$TARBALL"
          # Confirm the extract is what we think it is. An empty or wrong
          # directory would still satisfy the cache lookup and send the build
          # back to the fallback without saying so.
          "$DEST/rust/bin/rustc" --version
          echo "installed ${{ env.PLATFORM_TOOLS }} to $DEST"

      - name: Report SBF toolchain
        # Every config in this repo asks for platform-tools v1.57 (Rust 1.95),
        # but builds have been running rustc 1.84.1-dev, which is v1.51. The
        # mismatch is silent: cargo-build-sbf falls back instead of failing, and
        # it only surfaced when a dependency finally required a newer rustc.
        # Print what is actually resolved so the toolchain in use is visible
        # rather than inferred from an error message.
        run: |
          echo "requested PLATFORM_TOOLS: ${{ env.PLATFORM_TOOLS }}"
          echo "workspace metadata:      $(grep -A1 'metadata.solana' Cargo.toml | tail -1)"
          cargo build-sbf --version
          echo "--- with explicit --tools-version ---"
          cargo build-sbf --tools-version ${{ env.PLATFORM_TOOLS }} --version

      - name: Start validator
        run: |
          cargo build-sbf --tools-version ${{ env.PLATFORM_TOOLS }}
          solana-test-validator --bpf-program MNFSTqtC93rEfYHB6hF82sKdZpUDFWkViLByLd1k1Ms target/deploy/manifest.so --bpf-program UMnFStVeG1ecZFc2gc5K3vFy3sMpotq8C91mXBQDGwh target/deploy/ui_wrapper.so --bpf-program wMNFSTkir3HgyZTsB7uqu3i7FA73grFCptPXgrZjksL target/deploy/wrapper.so  >/dev/null 2>&1 &
          echo "Started test validator, sleeping for 15 seconds before starting"
          sleep 15

      - name: Run test
        run: |
          yarn test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          verbose: true
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  ts-pass:
    name: TS tests pass
    needs: ['format', 'lint', 'test', 'depcheck']
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
