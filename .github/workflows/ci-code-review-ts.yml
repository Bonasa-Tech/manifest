name: Code Review - TypeScript

on:
  pull_request:
    branches: ['main']
    paths: [
      'client/ts/**',
      'client/idl/*.json',
      'programs/**/instruction.rs',
      'yarn.lock'
    ]
  push:
    branches: ['main']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SOLANA_VERSION: '4.0.3'
  # pinocchio's account view crates need rustc 1.89 to build, so the host
  # toolchain moves up with them.
  RUST_TOOLCHAIN: '1.89.0'
  # Must match workspace.metadata.solana.tools-version.
  PLATFORM_TOOLS: 'v1.54'

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Format
        run: yarn format

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

  depcheck:
    name: Dependency check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Duplicates check
        run: npx yarn-deduplicate --list --fail

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Cache dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "solana-${{ env.SOLANA_VERSION }}-platform-tools-${{ env.PLATFORM_TOOLS }}"

      - name: Set Rust version
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }}

      - name: Install Solana
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output solana-install.sh https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install
          echo '9cefdb7493c9b42e91bf5d44663aea84042c5d2e6420a70aea10be11b7d74aaa  solana-install.sh' | sha256sum --check --strict
          sh solana-install.sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
          solana --version
          echo "Generating keypair..."
          solana-keygen new -o "$HOME/.config/solana/id.json" --no-passphrase --silent

      - name: Report SBF toolchain
        # Every config in this repo asks for platform-tools v1.57 (Rust 1.95),
        # but builds have been running rustc 1.84.1-dev, which is v1.51. The
        # mismatch is silent: cargo-build-sbf falls back instead of failing, and
        # it only surfaced when a dependency finally required a newer rustc.
        # Print what is actually resolved so the toolchain in use is visible
        # rather than inferred from an error message.
        run: |
          echo "requested PLATFORM_TOOLS: ${{ env.PLATFORM_TOOLS }}"
          echo "workspace metadata:      $(grep -A1 'metadata.solana' Cargo.toml | tail -1)"
          cargo build-sbf --version
          echo "--- with explicit --tools-version ---"
          cargo build-sbf --tools-version ${{ env.PLATFORM_TOOLS }} --version

      - name: Start validator
        run: |
          cargo build-sbf --tools-version ${{ env.PLATFORM_TOOLS }}
          solana-test-validator --bpf-program MNFSTqtC93rEfYHB6hF82sKdZpUDFWkViLByLd1k1Ms target/deploy/manifest.so --bpf-program UMnFStVeG1ecZFc2gc5K3vFy3sMpotq8C91mXBQDGwh target/deploy/ui_wrapper.so --bpf-program wMNFSTkir3HgyZTsB7uqu3i7FA73grFCptPXgrZjksL target/deploy/wrapper.so  >/dev/null 2>&1 &
          echo "Started test validator, sleeping for 15 seconds before starting"
          sleep 15

      - name: Run test
        run: |
          yarn test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          verbose: true
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  ts-pass:
    name: TS tests pass
    needs: ['format', 'lint', 'test', 'depcheck']
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
