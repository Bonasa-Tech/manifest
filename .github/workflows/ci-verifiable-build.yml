name: Verifiable Build
on:
  push:
    tags:
      - 'program-v*'
  workflow_dispatch:

env:
  MANIFEST_NAME: manifest
  WRAPPER_NAME: wrapper
  UI_WRAPPER_NAME: ui_wrapper
  # solana-verify 0.5.1's locked dependencies require Rust 1.89 or newer.
  RUST_TOOLCHAIN: '1.89.0'
  SOLANA_TOOLCHAIN: '2.2.20'
  SVM_ARCH: 'v2'
  # Must match workspace.metadata.solana.tools-version.
  PLATFORM_TOOLS: 'v1.57'
  SOLANA_VERIFIABLE_BUILD_IMAGE: 'solanafoundation/solana-verifiable-build@sha256:a1c0d5899ee0ffc81412428760662d9ba4643c2003ec3a92ab6f75a6e2e52a1b'
  # sha256 of platform-tools-linux-x86_64.tar.bz2 for the release above, as
  # published by GitHub for that asset.
  PLATFORM_TOOLS_SHA256: 'b0f7af104adf726fff2a6a09ea2eb2f2d2965c92295f4d7388c08d140e0c2b00'
  # Built in-job from the digest above; never pushed.
  VERIFIABLE_BUILD_IMAGE: 'manifest-verifiable-build:local'


jobs:
  build:
    name: Build Verifiable Artifact
    runs-on: ubuntu-latest
    # Building and publishing intentionally share one tag-triggered job so the
    # exact verified artifacts are released without a mutable handoff. Inputs
    # are pinned (actions by SHA, tool versions, Cargo --locked, and the build
    # image by digest), and GitHub grants only the repository-scoped token used
    # by action-gh-release for this trusted tag workflow.
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set Rust version
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --component rustfmt

      - name: Remove rust-toolchain.toml
        run: rm rust-toolchain.toml

      - name: Setup solana-verify
        run: |
          # 0.5.1 adds forwarding of cargo-build-sbf arguments, allowing the
          # verifiable container build to enforce the platform-tools pin.
          cargo +${{ env.RUST_TOOLCHAIN }} install solana-verify --version 0.5.1 --locked

      - name: Build the pinned verifiable-build image
        # solana-verify runs cargo-build-sbf inside the base image and mounts
        # only the source directory - format!("{mount_path}:{workdir}") in
        # v0.5.1 - so the host cache used by the other workflows cannot reach
        # it. Seed the toolchain into the image itself instead. The upstream
        # base stays pinned by digest; this adds the platform-tools release
        # this workflow already asks for and nothing else.
        run: |
          set -euo pipefail
          docker build \
            --build-arg BASE_IMAGE=${{ env.SOLANA_VERIFIABLE_BUILD_IMAGE }} \
            --build-arg PLATFORM_TOOLS=${{ env.PLATFORM_TOOLS }} \
            --build-arg PLATFORM_TOOLS_SHA256=${{ env.PLATFORM_TOOLS_SHA256 }} \
            --tag ${{ env.VERIFIABLE_BUILD_IMAGE }} \
            --file .github/docker/verifiable-build.Dockerfile \
            .github/docker

      - name: Verify the image resolves to the pinned platform-tools
        # Assert the condition that actually makes the build hermetic: a cached
        # toolchain >= the requested version, which short-circuits resolution
        # before it consults releases/latest. Checking the built-in version
        # instead would fail here forever, since the base ships v1.48.
        #
        # A release tag carrying a hash built by the wrong compiler is worse
        # than a failed build, so this gates the artifact rather than warning
        # about it.
        run: |
          set -euo pipefail
          docker run --rm ${{ env.VERIFIABLE_BUILD_IMAGE }} sh -eu -c '
            dest="/root/.cache/solana/${{ env.PLATFORM_TOOLS }}/platform-tools"
            test -x "$dest/rust/bin/rustc"
            echo "cached toolchain: ${{ env.PLATFORM_TOOLS }}"
            "$dest/rust/bin/rustc" --version
          '

      - name: Verifiable build manifest
        run: |
          solana-verify build --arch=${{ env.SVM_ARCH }} --cargo-build-sbf-args="--tools-version ${{ env.PLATFORM_TOOLS }}" --base-image ${{ env.VERIFIABLE_BUILD_IMAGE }} --library-name ${{ env.MANIFEST_NAME }}

      - name: Get hash manifest
        run: |
          solana-verify get-executable-hash target/deploy/${{ env.MANIFEST_NAME }}.so

      - name: Generate checksum manifest
        run: |
          echo "MANIFEST_CHECKSUM=$(sha256sum ./target/deploy/${{ env.MANIFEST_NAME }}.so | head -c 64)" >> $GITHUB_ENV

      - name: Generate SBOM manifest
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # master at review time
        with:
          scan-type: 'fs'
          format: 'cyclonedx'
          output: '${{ env.MANIFEST_NAME }}-${{ github.ref_name }}-sbom.json'

      - name: Verifiable build wrapper
        run: |
          solana-verify build --arch=${{ env.SVM_ARCH }} --cargo-build-sbf-args="--tools-version ${{ env.PLATFORM_TOOLS }}" --base-image ${{ env.VERIFIABLE_BUILD_IMAGE }} --library-name ${{ env.WRAPPER_NAME }}

      - name: Get hash wrapper
        run: |
          solana-verify get-executable-hash target/deploy/${{ env.WRAPPER_NAME }}.so

      - name: Generate Checksum wrapper
        run: |
          echo "WRAPPER_CHECKSUM=$(sha256sum ./target/deploy/${{ env.WRAPPER_NAME }}.so | head -c 64)" >> $GITHUB_ENV

      - name: Generate SBOM wrapper
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # master at review time
        with:
          scan-type: 'fs'
          format: 'cyclonedx'
          output: '${{ env.WRAPPER_NAME }}-${{ github.ref_name }}-sbom.json'

      - name: Verifiable build ui wrapper
        run: |
          solana-verify build --arch=${{ env.SVM_ARCH }} --cargo-build-sbf-args="--tools-version ${{ env.PLATFORM_TOOLS }}" --base-image ${{ env.VERIFIABLE_BUILD_IMAGE }} --library-name ${{ env.UI_WRAPPER_NAME }}

      - name: Get hash ui wrapper
        run: |
          solana-verify get-executable-hash target/deploy/${{ env.UI_WRAPPER_NAME }}.so

      - name: Generate Checksum ui wrapper
        run: |
          echo "UI_WRAPPER_CHECKSUM=$(sha256sum ./target/deploy/${{ env.UI_WRAPPER_NAME }}.so | head -c 64)" >> $GITHUB_ENV

      - name: Generate SBOM ui wrapper
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # master at review time
        with:
          scan-type: 'fs'
          format: 'cyclonedx'
          output: '${{ env.UI_WRAPPER_NAME }}-${{ github.ref_name }}-sbom.json'

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            manifest sha256 checksum: ${{ env.MANIFEST_CHECKSUM }}
            wrapper sha256 checksum: ${{ env.WRAPPER_CHECKSUM }}
            ui_wrapper sha256 checksum: ${{ env.UI_WRAPPER_CHECKSUM }}
            github commit: ${{ github.sha }}
          files: |
            ./target/deploy/${{ env.MANIFEST_NAME }}.so
            ./${{ env.MANIFEST_NAME }}-${{ github.ref_name }}-sbom.json
            ./target/deploy/${{ env.WRAPPER_NAME }}.so
            ./${{ env.WRAPPER_NAME }}-${{ github.ref_name }}-sbom.json
            ./target/deploy/${{ env.UI_WRAPPER_NAME }}.so
            ./${{ env.UI_WRAPPER_NAME }}-${{ github.ref_name }}-sbom.json
