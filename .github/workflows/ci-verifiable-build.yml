name: Verifiable Build
on:
  push:
    tags:
      - 'program-v*'
  workflow_dispatch:

env:
  MANIFEST_NAME: manifest
  WRAPPER_NAME: wrapper
  UI_WRAPPER_NAME: ui_wrapper
  # solana-verify 0.5.1's locked dependencies require Rust 1.89 or newer.
  RUST_TOOLCHAIN: '1.89.0'
  SOLANA_TOOLCHAIN: '4.2.2'
  SVM_ARCH: 'v3'
  # Must match workspace.metadata.solana.tools-version.
  PLATFORM_TOOLS: 'v1.57'
  SOLANA_VERIFIABLE_BUILD_IMAGE: 'solanafoundation/solana-verifiable-build@sha256:16053d845922e798ab1852d3fe222faf5a23eeb1db3a13d30b70d6b6e82184ae'


jobs:
  build:
    name: Build Verifiable Artifact
    runs-on: ubuntu-latest
    # Building and publishing intentionally share one tag-triggered job so the
    # exact verified artifacts are released without a mutable handoff. Inputs
    # are pinned (actions by SHA, tool versions, Cargo --locked, and the build
    # image by digest), and GitHub grants only the repository-scoped token used
    # by action-gh-release for this trusted tag workflow.
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set Rust version
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --component rustfmt

      - name: Remove rust-toolchain.toml
        run: rm rust-toolchain.toml

      - name: Setup solana-verify
        run: |
          # 0.5.1 adds forwarding of cargo-build-sbf arguments, allowing the
          # verifiable container build to enforce the platform-tools pin.
          cargo +${{ env.RUST_TOOLCHAIN }} install solana-verify --version 0.5.1 --locked

      - name: Verify the image resolves to the pinned platform-tools
        # cargo-build-sbf returns early when the requested version equals its
        # built-in one, and only then - otherwise it consults
        # platform-tools/releases/latest, which reports the most recently
        # published release rather than the highest, and silently downgrades.
        # The image above is chosen so those match, which is what makes this
        # build hermetic and reproducible with stock solana-verify.
        #
        # Assert it rather than assume it: a release tag carrying a hash built
        # by the wrong compiler is worse than a failed build.
        run: |
          set -euo pipefail
          BUILTIN=$(docker run --rm ${{ env.SOLANA_VERIFIABLE_BUILD_IMAGE }} \
            cargo-build-sbf --version 2>/dev/null \
            | grep -oE 'platform-tools v[0-9.]+' | head -1 || true)
          echo "image built-in: ${BUILTIN:-<unknown>}"
          echo "workflow pins:  platform-tools ${{ env.PLATFORM_TOOLS }}"
          if [ "$BUILTIN" != "platform-tools ${{ env.PLATFORM_TOOLS }}" ]; then
            echo "::error::Base image ships ${BUILTIN:-an unknown toolchain} but this build pins ${{ env.PLATFORM_TOOLS }}. cargo-build-sbf would fall back silently and the artifact would not match the pinned compiler."
            exit 1
          fi

      - name: Verifiable build manifest
        run: |
          solana-verify build --arch=${{ env.SVM_ARCH }} --cargo-build-sbf-args="--tools-version ${{ env.PLATFORM_TOOLS }}" --base-image ${{ env.SOLANA_VERIFIABLE_BUILD_IMAGE }} --library-name ${{ env.MANIFEST_NAME }}
          ./scripts/assert-sbpf-v3.sh target/deploy/${{ env.MANIFEST_NAME }}.so

      - name: Get hash manifest
        run: |
          solana-verify get-executable-hash target/deploy/${{ env.MANIFEST_NAME }}.so

      - name: Generate checksum manifest
        run: |
          echo "MANIFEST_CHECKSUM=$(sha256sum ./target/deploy/${{ env.MANIFEST_NAME }}.so | head -c 64)" >> $GITHUB_ENV

      - name: Generate SBOM manifest
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # master at review time
        with:
          scan-type: 'fs'
          format: 'cyclonedx'
          output: '${{ env.MANIFEST_NAME }}-${{ github.ref_name }}-sbom.json'

      - name: Verifiable build wrapper
        run: |
          solana-verify build --arch=${{ env.SVM_ARCH }} --cargo-build-sbf-args="--tools-version ${{ env.PLATFORM_TOOLS }}" --base-image ${{ env.SOLANA_VERIFIABLE_BUILD_IMAGE }} --library-name ${{ env.WRAPPER_NAME }}
          ./scripts/assert-sbpf-v3.sh target/deploy/${{ env.WRAPPER_NAME }}.so

      - name: Get hash wrapper
        run: |
          solana-verify get-executable-hash target/deploy/${{ env.WRAPPER_NAME }}.so

      - name: Generate Checksum wrapper
        run: |
          echo "WRAPPER_CHECKSUM=$(sha256sum ./target/deploy/${{ env.WRAPPER_NAME }}.so | head -c 64)" >> $GITHUB_ENV

      - name: Generate SBOM wrapper
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # master at review time
        with:
          scan-type: 'fs'
          format: 'cyclonedx'
          output: '${{ env.WRAPPER_NAME }}-${{ github.ref_name }}-sbom.json'

      - name: Verifiable build ui wrapper
        run: |
          solana-verify build --arch=${{ env.SVM_ARCH }} --cargo-build-sbf-args="--tools-version ${{ env.PLATFORM_TOOLS }}" --base-image ${{ env.SOLANA_VERIFIABLE_BUILD_IMAGE }} --library-name ${{ env.UI_WRAPPER_NAME }}
          ./scripts/assert-sbpf-v3.sh target/deploy/${{ env.UI_WRAPPER_NAME }}.so

      - name: Get hash ui wrapper
        run: |
          solana-verify get-executable-hash target/deploy/${{ env.UI_WRAPPER_NAME }}.so

      - name: Generate Checksum ui wrapper
        run: |
          echo "UI_WRAPPER_CHECKSUM=$(sha256sum ./target/deploy/${{ env.UI_WRAPPER_NAME }}.so | head -c 64)" >> $GITHUB_ENV

      - name: Generate SBOM ui wrapper
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # master at review time
        with:
          scan-type: 'fs'
          format: 'cyclonedx'
          output: '${{ env.UI_WRAPPER_NAME }}-${{ github.ref_name }}-sbom.json'

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            manifest sha256 checksum: ${{ env.MANIFEST_CHECKSUM }}
            wrapper sha256 checksum: ${{ env.WRAPPER_CHECKSUM }}
            ui_wrapper sha256 checksum: ${{ env.UI_WRAPPER_CHECKSUM }}
            github commit: ${{ github.sha }}

            built with platform-tools ${{ env.PLATFORM_TOOLS }}
            base image: ${{ env.SOLANA_VERIFIABLE_BUILD_IMAGE }}

            Reproduce with stock solana-verify - the image's built-in
            platform-tools matches the pinned version, so resolution is
            deterministic:

              solana-verify build --arch ${{ env.SVM_ARCH }} \
                --cargo-build-sbf-args="--tools-version ${{ env.PLATFORM_TOOLS }}" \
                --base-image ${{ env.SOLANA_VERIFIABLE_BUILD_IMAGE }} \
                --library-name manifest
          files: |
            ./target/deploy/${{ env.MANIFEST_NAME }}.so
            ./${{ env.MANIFEST_NAME }}-${{ github.ref_name }}-sbom.json
            ./target/deploy/${{ env.WRAPPER_NAME }}.so
            ./${{ env.WRAPPER_NAME }}-${{ github.ref_name }}-sbom.json
            ./target/deploy/${{ env.UI_WRAPPER_NAME }}.so
            ./${{ env.UI_WRAPPER_NAME }}-${{ github.ref_name }}-sbom.json
