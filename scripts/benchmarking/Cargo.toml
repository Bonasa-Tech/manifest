[package]
name = "benchmarking"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/Bonasa-Tech/manifest"
authors = ["Britt Cyr <britt@manifest.trade>"]
description = "Benchmarking for Manifest"
license-file = "../../LICENSE"

# Keep the harness isolated from the program workspace and its lockfile.
[workspace]

[lib]
crate-type = ["cdylib", "lib"]
name = "benchmarking"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
no-log-ix-name = []
default = []
test = []
fuzzing = []

[dependencies]
hypertree = { path = "../../lib" }
manifest-dex = { path = "../../programs/manifest", features = ["no-clock"] }
wrapper = { path = "../../programs/wrapper" }
shank = "0.4.2"
spl-token = { version = "9", features = ["no-entrypoint"] }
spl-token-2022 = { version = "11", features = [ "no-entrypoint" ] }
spl-associated-token-account = { version = "8" }
csv = "<1.4.0"
solana-compute-budget-interface = "3.0.0"
borsh = "=0.10"

[dev-dependencies]
anyhow = "1.0.66"
solana-program-test = { version = "=4.2.2", features = ["agave-unstable-api"] }
solana-logger = "3"
solana-sdk = "=4.0.1"
solana-pubkey = "=4.2.1"
solana-address = "=1.1.0"
solana-instruction = "=3.4.0"
solana-account = "=4.3.1"
solana-transaction = "=4.1.4"
solana-clock = "=3.1.1"
solana-hash = "=4.5.0"
solana-system-interface = { version = "=3.2.0", features = ["bincode"] }
five8_core = { version = "=0.1.2", features = ["std"] }
tokio = "1.28.0"
rand = "0.8.5"
serde_json = "1.0.120"
